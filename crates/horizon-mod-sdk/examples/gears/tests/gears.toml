# gears:counter swallows iron ingots beside it, stops while powered, and
# chimes and drops a nugget each minute, and powers the block under it while
# it runs (items, redstone, effects).

[[step]]
join = "Alex"
blocks = [{ x = 5, y = 64, z = 5, state = "gears:counter" }]
place = { x = 5, y = 64, z = 5, state = "gears:counter" }
# Its gear turns, the ingot on it laid flat and turning with it.
expect.visuals = [
    "5 64 5 minecraft:iron_trapdoor[half=bottom] 2.8125 offset [0.0, 1.1, 0.0] velocity [0.0, 0.0, 0.0]",
    "5 64 5 minecraft:iron_ingot 2.8125 offset [0.0, 0.82, 0.0] velocity [0.0, 0.0, 0.0] turned [0.707, 0.0, 0.0, 0.707]",
]

# An ingot lying next to it is carried in within a second.
[[step]]
items = [
    { id = 7, item = "minecraft:iron_ingot", x = 5.5, y = 64.5, z = 5.5 },
    { id = 8, item = "minecraft:dirt", x = 5.5, y = 64.5, z = 5.5 },
    { id = 9, item = "minecraft:iron_ingot", x = 40.5, y = 64.5, z = 5.5 },
]
ticks = 20
expect.taken = [7]
expect.drops = ["minecraft:iron_nugget x9 at 5.5 65 5.5"]
# Running, it gives the block under it a signal (weak: a strong one would
# come back to it through that block).
expect.outputs = ["5 64 5 down 15 0"]

# A redstone signal stops it.
[[step]]
power = [{ x = 5, y = 64, z = 5, level = 3 }]
items = [{ id = 10, item = "minecraft:iron_ingot", x = 5.5, y = 64.5, z = 5.5 }]
ticks = 40
expect.taken = []
expect.drops = []
expect.outputs = []
# Its gear stops, drawn red.
expect.visuals = [
    "5 64 5 minecraft:iron_trapdoor[half=bottom] 0 offset [0.0, 1.1, 0.0] velocity [0.0, 0.0, 0.0] colored ff6060",
    "5 64 5 minecraft:iron_ingot 0 offset [0.0, 0.82, 0.0] velocity [0.0, 0.0, 0.0] turned [0.707, 0.0, 0.0, 0.707]",
]

# Without it, a minute of running: the anvil chimes and smoke rises.
[[step]]
power = []
items = []
ticks = 1180
expect.effects = [
    "sound minecraft:block.anvil.use at 5 64 5",
    "event 2000 1 at 5 65 5",
]
expect.drops = ["minecraft:iron_nugget x1 at 5.5 65 5.5"]

# A stick on the counter names it (`item-used`, a click with an item).
[[step]]
use = { x = 5, y = 64, z = 5, face = "up", item = "minecraft:stick" }
expect.told = ["Alex: This is gears:counter"]

# With a container under it the nuggets go in (`transfer`) instead of
# dropping; the player's slots are as a step set them.
[[step]]
slots = [{ x = 5, y = 63, z = 5, slot = 0, item = "minecraft:stone", count = 0 }]
inventory = [{ slot = 0, item = "minecraft:stick", count = 3 }]
items = [{ id = 20, item = "minecraft:iron_ingot", x = 5.5, y = 64.5, z = 5.5 }]
ticks = 20
expect.taken = [20]
expect.drops = []
expect.slots = ["5 63 5 0 minecraft:iron_nugget x9"]
expect.inventory = ["0 minecraft:stick x3"]

# A counter set as /setblock sets it, not placed by a player, still runs: the
# game gives a mod's ticking block its data however it appears.
[[step]]
blocks = [{ x = 9, y = 64, z = 9, state = "gears:counter" }]
items = [{ id = 30, item = "minecraft:iron_ingot", x = 9.5, y = 64.5, z = 9.5 }]
ticks = 20
expect.taken = [30]

# A sneak-click with an empty hand starts it again (`players.sneaking`).
[[step]]
use = { x = 9, y = 64, z = 9, face = "up", sneaking = true }
expect.told = ["Alex: The counter starts again from 0"]
